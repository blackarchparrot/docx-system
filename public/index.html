<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOCX Cloud Platform</title>
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/docx-preview@0.1.15/dist/docx-preview.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #eef2f5; }
    #header { height: 50px; background: #1a252f; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    #editor-container { height: calc(100vh - 50px); padding: 20px; overflow-y: auto; display: flex; justify-content: center; }
    .docx-wrapper { background: transparent !important; padding: 0 !important; }
    .docx-wrapper > section.docx { box-shadow: 0 4px 10px rgba(0,0,0,0.15) !important; margin-bottom: 20px !important; }
    .btn { background: #27ae60; color: white; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>

  <div id="header">
    <div><strong>DocWorkspace</strong> | Vercel Live Platform</div>
    <div>
      <input type="file" id="fileInput" accept=".docx" style="display:none;" onchange="handleUpload()" />
      <button class="btn" onclick="document.getElementById('fileInput').click()">Upload DOCX</button>
      <a href="/admin" class="btn" style="background:#e67e22; margin-left: 10px;">Audit Logs</a>
    </div>
  </div>

  <div id="editor-container">
    <div id="document-render"></div>
  </div>

  <script>
    async function handleUpload() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      const renderTarget = document.getElementById("document-render");
      renderTarget.innerHTML = "<p>Loading document preview...</p>";

      // Render native preview directly in browser
      const arrayBuffer = await file.arrayBuffer();
      renderTarget.innerHTML = "";
      await docx.renderAsync(arrayBuffer, renderTarget);

      // Upload file payload to Vercel API
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fileName: file.name, fileBase64: base64, user: 'Vercel User' })
        });
      };
    }
  </script>
</body>
</html>
